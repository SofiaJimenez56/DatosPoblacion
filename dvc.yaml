stages:
  prepararDatos:
    desc: >
      Integra las bases de Hogar y Vivienda del INEGI (ENTI 2022),
      limpia los datos, trata códigos especiales y valores faltantes,
      y genera el dataset procesado con la variable binaria
      tiene_trabajo_infantil para el análisis de trabajo infantil.
    cmd: python src/preparar_datos.py
    deps:
      - src/preparar_datos.py
      - data/raw/conjunto_de_datos_hog_enti_2022.csv
      - data/raw/conjunto_de_datos_viv_enti_2022.csv
    outs:
      - data/processed/inegi_procesado.csv